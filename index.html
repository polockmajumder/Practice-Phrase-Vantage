<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Effect</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            overflow-x: hidden;
            background-color: #fadcdc;
        }

        /* =======================================================
           COLOR VARIABLE DEFINITIONS (sRGB Fallback + Display P3)
           ======================================================= */
        :root {
            /* Deep, premium burgundy-reds (Standard Fallback) */
            --bg-bar-1: #1a0003;
            --bg-bar-2: #260005;
            --bg-bar-3: #330008;
            --bg-bar-4: #40000a;
            --bg-bar-5: #4d000d;
            --accent-red: #e60000;
        }

        /* Target High-Gamut Mobile Screens (OLED / P3 Displays) */
        @supports (color: color(display-p3 1 0 0)) {
            :root {
                /* True deep reds without orange/yellow shifts */
                --bg-bar-1: color(display-p3 0.10 0.00 0.02);
                --bg-bar-2: color(display-p3 0.15 0.00 0.03);
                --bg-bar-3: color(display-p3 0.20 0.00 0.04);
                --bg-bar-4: color(display-p3 0.25 0.00 0.05);
                --bg-bar-5: color(display-p3 0.30 0.00 0.06);
                --accent-red: color(display-p3 0.90 0.00 0.05);
            }
        }

        /* =======================================================
           LOADING PAGE STYLES
           ======================================================= */
        .loading-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 100;
            overflow: hidden;
            animation: hideLoader 0s linear 2.2s forwards;
            background-color: transparent;
        }

        .bars-container {
            display: flex;
            flex-direction: row; 
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .bar {
            flex: 1;
            height: 115vh; 
            width: auto;
            transform-origin: top center;
            transform: scaleX(1.02);
            will-change: transform;
            
            border-bottom-left-radius: 100px;
            border-bottom-right-radius: 100px;
            
            position: relative;
            animation: slideUpBar 0.9s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: calc(0.8s + (var(--i) * 0.04s));
        }

        /* Color Assignments Using P3-Safe Custom Properties */
        .bar:nth-child(1), .bar:nth-child(9) { background-color: var(--bg-bar-1); z-index: 1; }
        .bar:nth-child(2), .bar:nth-child(8) { background-color: var(--bg-bar-2); z-index: 2; }
        .bar:nth-child(3), .bar:nth-child(7) { background-color: var(--bg-bar-3); z-index: 3; }
        .bar:nth-child(4), .bar:nth-child(6) { background-color: var(--bg-bar-4); z-index: 4; }
        .bar:nth-child(5) { background-color: var(--bg-bar-5); z-index: 5; }

        .bar:nth-child(-n+4) { box-shadow: -8px 0 16px rgba(0, 0, 0, 0.25); }
        .bar:nth-child(5) { box-shadow: -8px 0 16px rgba(0, 0, 0, 0.25), 8px 0 16px rgba(0, 0, 0, 0.25); }
        .bar:nth-child(n+6) { box-shadow: 8px 0 16px rgba(0, 0, 0, 0.25); }

        .loading-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            animation: hideContent 0.7s cubic-bezier(0.25, 1, 0.5, 1) 0.8s forwards;
        }

        .loading-center {
            text-align: center;
        }

        .logo-text {
            color: #fedbdb;
            font-size: 32px; 
            font-weight: 500;
            letter-spacing: 1px;
            opacity: 0;
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            animation: aestheticPop 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .logo-text span {
            color: var(--accent-red);
        }

        .enter-text {
            color: #fecfcf;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 1px;
            opacity: 0;
            display: none; 
            animation: fadeInSimple 0.8s ease-out 0.3s forwards;
        }

        .loading-bottom {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #fecfcf;
            font-size: 12px;
            font-weight: 400;
            opacity: 0;
            animation: fadeInSimple 0.8s ease-out 0.4s forwards;
        }

        @keyframes slideUpBar {
            0% { transform: scaleX(1.02) translateY(0); }
            100% { transform: scaleX(1.02) translateY(-115vh); }
        }

        @keyframes hideContent {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-100vh); }
        }

        @keyframes hideLoader {
            0% { visibility: visible; pointer-events: auto; }
            100% { visibility: hidden; pointer-events: none; }
        }

        @keyframes aestheticPop {
            0% { opacity: 0; transform: scale(0.85) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes fadeInSimple {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* =========================================
           DESKTOP STYLES
           ========================================= */
        @media (min-width: 1024px) {
            .loading-center { transform: translateY(-20px); }
            .logo-text { font-size: 70px; gap: 0; margin-bottom: 15px; }
            .logo-text span { margin-left: 30px; }
            .enter-text { display: block; }
            .loading-bottom { bottom: 30px; right: 40px; font-size: 15px; }
        }
    </style>
</head>
<body>
    
    <div class="loading-page">
        <div class="bars-container">
            <div class="bar" style="--i: 8;"></div>
            <div class="bar" style="--i: 7;"></div>
            <div class="bar" style="--i: 6;"></div>
            <div class="bar" style="--i: 5;"></div>
            <div class="bar" style="--i: 4;"></div>
            <div class="bar" style="--i: 3;"></div>
            <div class="bar" style="--i: 2;"></div>
            <div class="bar" style="--i: 1;"></div>
            <div class="bar" style="--i: 0;"></div>
        </div>
        <div class="loading-content">
            <div class="loading-center">
                <h1 class="logo-text">PHRASE<span>VANTAGE</span></h1>
                <p class="enter-text">POLOCK MAJUMDER</p>
            </div>
            <div class="loading-bottom">SINCE 2026</div>
        </div>
    </div>

</body>
</html>
